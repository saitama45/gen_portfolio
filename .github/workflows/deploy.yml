name: Check and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check site and build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: node --check assets/js/site.js

      - name: Check the page's links and images
        run: node .github/scripts/check-site.mjs

      - name: Check contact form syntax
        run: php -l contact.php

      # index.old.html is the backup of the previous design, kept in the repo but not published
      - name: Create package
        run: tar -cf "$RUNNER_TEMP/package.tar" --exclude=./.git --exclude=./.github --exclude=./.gitignore --exclude=./index.old.html .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package.tar
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy with Web Deploy
    needs: check
    runs-on: windows-latest
    # Never run two deploys against the server at the same time
    concurrency:
      group: deploy-site59739
      cancel-in-progress: false

    # MonsterASP.NET "Visual Studio access" (WebDeploy) details; only the password is secret.
    # site59739.siteasp.net is the deploy endpoint, not the public address of the website.
    env:
      WEBDEPLOY_SITE: site59739
      WEBDEPLOY_URL: https://site59739.siteasp.net:8172/msdeploy.axd?site=site59739
      WEBDEPLOY_USERNAME: site59739

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Unpack package
        shell: pwsh
        run: |
          $release = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force $release | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\package.tar" -C $release
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }

      # The mail password is written into the package here, never into the repo.
      # IIS refuses to serve App_Data, and the file is PHP that prints nothing if it ever runs.
      - name: Write contact form config
        shell: pwsh
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if (-not $env:MAIL_PASSWORD) {
            Write-Output "::warning::Repository secret MAIL_PASSWORD is not set, so the contact form falls back to the visitor's email app."
            exit 0
          }
          # Google displays app passwords with spaces, which aren't part of the password
          $password = $env:MAIL_PASSWORD -replace '\s', ''
          Write-Output "::add-mask::$password"
          $folder = "$env:RUNNER_TEMP\release\App_Data"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $escaped = $password.Replace('\', '\\').Replace("'", "\'")
          # WriteAllText adds no byte order mark, which PHP would otherwise print before the opening tag
          [IO.File]::WriteAllText("$folder\contact-config.php", "<?php return ['password' => '$escaped'];`n")

      - name: Deploy and verify
        shell: pwsh
        env:
          WEBDEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          if (-not $env:WEBDEPLOY_PASSWORD) { throw 'Repository secret WEBDEPLOY_PASSWORD is not set.' }
          # A pasted secret often carries a trailing line break, which the server rejects as a wrong password
          $password = $env:WEBDEPLOY_PASSWORD.Trim()
          Write-Output "::add-mask::$password"
          Write-Host "WEBDEPLOY_PASSWORD: $($password.Length) characters after trimming ($($env:WEBDEPLOY_PASSWORD.Length) as stored)"

          $msdeploy = @(
            "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) {
            choco install webdeploy -y --no-progress
            $msdeploy = "$env:ProgramFiles\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          $release = "$env:RUNNER_TEMP\release"
          # Arguments go through an array so PowerShell passes each one to msdeploy unchanged
          # (the password must not contain a comma or a double quote).
          $connection = "computerName=$env:WEBDEPLOY_URL,userName=$env:WEBDEPLOY_USERNAME,password=$password,authType=Basic,includeAcls=False"

          function Invoke-WebDeploy([string] $Source, [string] $Target, [string[]] $Rules = @()) {
            $arguments = @(
              '-verb:sync',
              "-source:contentPath=$Source",
              "-dest:contentPath=$Target,$connection",
              '-allowUntrusted',
              '-useChecksum',
              '-disableLink:AppPoolExtension',
              '-disableLink:ContentExtension',
              '-disableLink:CertificateExtension',
              '-retryAttempts:3',
              '-retryInterval:5000'
            ) + $Rules
            $output = & $msdeploy @arguments
            $code = $LASTEXITCODE
            $output | Write-Host
            if ($code -ne 0) { throw "msdeploy failed with exit code $code" }
            return $output
          }

          # assets/ is mirrored exactly, so images and scripts removed from the repo leave the server too.
          Invoke-WebDeploy "$release\assets" "$env:WEBDEPLOY_SITE/assets" | Out-Null

          # Everything else uploads changed files only and never deletes anything on the server
          # (.well-known holds the SSL certificate challenge, and must stay).
          Invoke-WebDeploy $release $env:WEBDEPLOY_SITE @('-enableRule:DoNotDeleteRule') | Out-Null

          # Compare again by checksum without changing anything: a good deploy leaves nothing to do.
          $check = Invoke-WebDeploy $release $env:WEBDEPLOY_SITE @('-enableRule:DoNotDeleteRule', '-whatif')
          $summary = $check | Where-Object { $_ -match 'Total changes: \d+' } | Select-Object -Last 1
          if ($summary -notmatch 'Total changes: 0\b') { throw "Server does not match the package after deploying: $summary" }
          Write-Host 'Verified: the server matches this commit.'

      # Set the repository variable SITE_URL (e.g. https://www.example.com) to turn this check on.
      - name: Check the live website
        if: ${{ vars.SITE_URL != '' }}
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          $base = $env:SITE_URL.TrimEnd('/')
          $page = Invoke-WebRequest "$base/" -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 6
          if ($page.Content -notmatch 'Gener Magbanua') { throw "The home page at $base does not look like this site." }
          $image = Invoke-WebRequest "$base/assets/img/portrait.webp" -UseBasicParsing -MaximumRetryCount 5 -RetryIntervalSec 6
          if ($image.Headers['Content-Type'] -notmatch 'image/webp') { throw "portrait.webp came back as $($image.Headers['Content-Type'])." }
          # PHP is running if the form endpoint answers a GET with its own 405, and the config must stay out of reach
          $endpoint = Invoke-WebRequest "$base/contact.php" -UseBasicParsing -SkipHttpErrorCheck
          if ($endpoint.StatusCode -ne 405) { throw "contact.php answered $($endpoint.StatusCode), so PHP may not be running. The form will fall back to the visitor's email app." }
          $config = Invoke-WebRequest "$base/App_Data/contact-config.php" -UseBasicParsing -SkipHttpErrorCheck
          if ($config.StatusCode -eq 200 -and $config.RawContentLength -gt 0) { throw 'App_Data/contact-config.php can be read from the web.' }
          Write-Host "Live site and contact form are up at $base"
